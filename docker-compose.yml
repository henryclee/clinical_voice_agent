services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical_voice_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: clinical_voice
    ports:
      - "5432:5432"
    volumes:
      - clinical_voice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_voice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinical_voice_pgdata:
